<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Secure Multi-Cloud Backup{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 420px; margin: 60px auto; color: #222; }
        h1 { font-size: 1.4rem; }
        label { display: block; margin-top: 12px; font-size: 0.9rem; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 8px 16px; }
        .errors { color: #b00020; font-size: 0.85rem; }
        .messages { list-style: none; padding: 0; color: #0a7a2f; }
        nav a { margin-right: 12px; }
    </style>
</head>
<body>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
